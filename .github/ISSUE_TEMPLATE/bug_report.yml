name: 🐞 Bug report
description: Something broke in the skill, scripts, or installer
title: "[bug]: "
labels: [bug]
body:
  - type: input
    id: harness
    attributes:
      label: Harness
      description: Where did you run it? (omp, claude-code, codex, opencode, antigravity + version)
      placeholder: omp 0.9.x
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Skill version
      description: Release tag or commit SHA
      placeholder: v1.0.0
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Command/job, expected vs actual, logs (redact secrets)
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Smallest scope that triggers it (e.g. single file, --commit SHA)
